[project]
name = "leadh"
version = "0.1.0"
description = "Finds French SMEs that must issue e-invoices from September 2027, checks each is a lawful B2B lead, and scores it"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "dnspython>=2.6",
    "httpx>=0.27",
    "openai>=1.40",   # OpenAI-compatible client: any provider with a chat completions endpoint
    "pydantic>=2.7",
    "pyyaml>=6",
]

[project.scripts]
leadh = "leadh.cli:main"

[dependency-groups]
dev = ["mypy>=1.11", "pytest>=8", "ruff>=0.6", "types-pyyaml"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leadh"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["leadh"]

[[tool.mypy.overrides]]
module = ["bs4.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
