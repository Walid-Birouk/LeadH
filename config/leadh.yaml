# Starting values from the design. Recalibrate weights on the first 100 labelled leads; bump rules_version
# whenever a rule or weight changes so the next run re-scores and re-validates.
rules_version: v2   # v2: directory_site rule
data_dir: data
shadow_mode: true   # verdicts are written but nothing is handed off until you switch this off

registry:
  base_url: https://recherche-entreprises.api.gouv.fr
  # The API filters on exact NAF codes; these are the B2B families below spelled out.
  naf_codes: ["62.01Z", "62.02A", "62.02B", "62.03Z", "62.09Z", "70.22Z", "73.11Z", "71.12B"]
  regions: ["11"]
  per_page: 25
  request_interval_s: 0.2   # the API allows 7 requests a second
  # Sirene/RNE flag for a GDPR art. 21 objection to reuse of the company's data for prospecting.
  skip_commercial_opposition: true
  # Sirene bands 01 to 12 are 1 to 49 employees. Companies with staff far more often have a site that names them;
  # empty the list to include 0 employees and unknown bands (most new companies).
  employee_bands: ["01", "02", "03", "11", "12"]
  exclude_sole_traders: true

naf:
  b2b_prefixes: ["62", "70.22Z", "73.11Z", "71.12B", "46", "43"]
  # 69.20Z is accountants: partners, contacted by hand.
  excluded_prefixes: ["47", "56", "69.20Z"]

search:
  # One or several of brave, agentreach, guess, none, joined by "+". brave is the Brave Search API; agentreach is
  # Agent-Reach's web search (Exa, no key; see the reach section); guess tries the company name as a .fr or .com
  # domain. Only a page showing the SIREN makes a match, whatever found the candidate.
  # No Brave key? LEADH_SEARCH=agentreach+guess.
  provider: brave+agentreach+guess
  api_key_env: BRAVE_SEARCH_API_KEY
  interval_s: 1.0        # Brave's free plan allows one query a second
  max_candidates: 4

# Agent-Reach (https://github.com/Panniantong/Agent-Reach), installed separately as the `agent-reach` command.
# When the command is missing, every helper below is skipped with one warning and the run carries on.
reach:
  enabled: true
  command: agent-reach
  timeout_s: 60
  search_limit: 8
  # After "rate limited" or "busy", a channel rests for the time Agent-Reach gives (or pause_s); a lead whose site
  # search fell in that rest stays "found" and is tried again next run. max_strikes in a row: off for the run.
  min_interval_s: 3
  pause_s: 120
  max_wait_s: 15
  max_strikes: 3
  # A site that refuses LeadH (HTTP 401, 403, 406, 429, 503) is read through Agent-Reach (Jina Reader) instead.
  # Pages robots.txt disallows are never read this way.
  read_fallback: true
  # Public LinkedIn job search, no login, for admin, accounting or invoicing ads posted by the lead's company. An ad
  # is only read by the Signal reader for admin_job_ad; contacts, tools and outreach slots never come from it.
  linkedin_jobs: true
  jobs_limit: 10

crawler:
  user_agent: "LeadH/0.1 (+https://github.com/Walid-Birouk/LeadH)"
  request_interval_s: 1.0
  timeout_s: 15
  max_tries: 5
  breaker_threshold: 3
  breaker_pause_s: 60

# DeepSeek Flash with thinking off: extraction needs no reasoning trace, and thinking is the provider's default.
# Data is processed in China; for real prospects consider an EU host (Mistral: https://api.mistral.ai/v1,
# mistral-small-latest). LLM_BASE_URL=mock runs offline. Prices are the off-peak cache-miss rates, used only for the
# report's cost line; peak hours (01-04 and 06-10 UTC on weekdays) cost double, so schedule the run outside them.
llm:
  base_url: https://api.deepseek.com
  model: deepseek-flash
  api_key_env: DEEPSEEK_API_KEY
  json_mode: true
  extra_body: {thinking: {type: disabled}}
  timeout_s: 60
  max_chars_per_page: 6000
  usd_per_mtok_in: 0.15
  usd_per_mtok_out: 0.60

limits:
  candidates_per_run: 300
  pages_per_site: 5
  seconds_per_lead: 60
  llm_tokens_per_run: 400000
  handoffs_per_day: 30
  freshness_days: 30
  quote_max_words: 25
  recent_creation_months: 18

scoring:
  need:
    sells_to_businesses: 25
    manual_invoicing: 25
    employees_1_to_49: 15
    no_invoicing_tool: 15
    created_recently: 10
    admin_job_ad: 10
    invoicing_tool_detected: -30
  fit:
    english_pages: 40
    head_office_ile_de_france: 20
    naf_b2b: 20
    generic_contact: 20
  thresholds:
    approve_need: 50
    approve_fit: 60
    review_need: 35
    review_fit: 40

retention_days:
  pages: 30
  never_contacted: 182
